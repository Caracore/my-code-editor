[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"] # Lib à voir si mettre le [lib] ?

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

tauri = { version = "2.5", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9"
tauri-plugin-dialog = "2.5"
discord-rich-presence = "1.0"
parking_lot = "0.12"
trash = "5.2"